# Deploys taskstaka.com (crates/site) to Cloud Run on every push to main.
# Auth is keyless: Workload Identity Federation, pool "github" in project
# taskstaka, limited to this repository. The two repo variables are
# GCP_WIF_PROVIDER and GCP_DEPLOY_SA; the GCP side (service account
# github-deploy, pool github) was set up by hand. The deploy job waits for
# the test job: fmt, clippy and cargo test over the whole workspace (the tray
# crate needs GTK and WebKitGTK, installed below). Tests run on every push to
# main; the deploy only when the push touched the site, install.sh, the
# workspace manifests, this workflow, or on a manual run.
name: Deploy taskstaka.com

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-site
  cancel-in-progress: false

permissions:
  contents: read

env:
  PROJECT: taskstaka
  REGION: us-central1
  SERVICE: taskstaka-site
  IMAGE: us-central1-docker.pkg.dev/taskstaka/site/taskstaka-site

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Tray build packages
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace

  changes:
    runs-on: ubuntu-latest
    outputs:
      site: ${{ steps.diff.outputs.site }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          BEFORE: ${{ github.event.before }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo site=true >> "$GITHUB_OUTPUT"; exit 0
          fi
          base="$BEFORE"
          git cat-file -e "$base^{commit}" 2>/dev/null || base="HEAD~1"
          if git diff --name-only "$base" HEAD | grep -qE '^(crates/site/|install\.sh$|Cargo\.toml$|Cargo\.lock$|cloudbuild\.yaml$|\.github/workflows/deploy-site\.yml$)'; then
            echo site=true >> "$GITHUB_OUTPUT"
          else
            echo site=false >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: [test, changes]
    if: needs.changes.outputs.site == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Tag
        run: echo "TAG=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Build the image on Cloud Build
        run: >
          gcloud builds submit --project "$PROJECT" --region "$REGION"
          --config cloudbuild.yaml --substitutions "_TAG=$TAG" .

      - name: Deploy to Cloud Run
        run: >
          gcloud run deploy "$SERVICE" --image "$IMAGE:$TAG"
          --region "$REGION" --project "$PROJECT"
          --allow-unauthenticated --port 8080 --quiet

      - name: Check the live site
        run: |
          for path in / /install /help /changelog /-/health; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://taskstaka.com$path")
            echo "$path $code"
            [ "$code" = 200 ] || exit 1
          done
