# Deploys taskstaka.com (crates/site) to Cloud Run on every push to main.
# Auth is keyless: Workload Identity Federation, pool "github" in project
# taskstaka, limited to this repository. The two repo variables are
# GCP_WIF_PROVIDER and GCP_DEPLOY_SA; the GCP side (service account
# github-deploy, pool github) was set up by hand. The deploy job waits for
# the test job: fmt, clippy and cargo test over the whole workspace (the tray
# crate needs GTK and WebKitGTK, installed below).
name: Deploy taskstaka.com

on:
  push:
    branches: [main]
    paths:
      - "crates/site/**"
      - "install.sh"
      - "Cargo.toml"
      - "Cargo.lock"
      - "cloudbuild.yaml"
      - ".github/workflows/deploy-site.yml"
  workflow_dispatch:

concurrency:
  group: deploy-site
  cancel-in-progress: false

permissions:
  contents: read

env:
  PROJECT: taskstaka
  REGION: us-central1
  SERVICE: taskstaka-site
  IMAGE: us-central1-docker.pkg.dev/taskstaka/site/taskstaka-site

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Tray build packages
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace

  deploy:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Tag
        run: echo "TAG=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Build the image on Cloud Build
        run: >
          gcloud builds submit --project "$PROJECT" --region "$REGION"
          --config cloudbuild.yaml --substitutions "_TAG=$TAG" .

      - name: Deploy to Cloud Run
        run: >
          gcloud run deploy "$SERVICE" --image "$IMAGE:$TAG"
          --region "$REGION" --project "$PROJECT"
          --allow-unauthenticated --port 8080 --quiet

      - name: Check the live site
        run: |
          for path in / /install /help /changelog /-/health; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://taskstaka.com$path")
            echo "$path $code"
            [ "$code" = 200 ] || exit 1
          done
