[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
tododo-core = { path = "crates/core" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_norway = "0.9"
jiff = { version = "0.2", features = ["serde"] }
thiserror = "2"
anyhow = "1"
tempfile = "3"
fd-lock = "4"
rand = "0.9"
clap = { version = "4", features = ["derive", "env"] }

insta = { version = "1", features = ["yaml"] }
assert_cmd = "2"
predicates = "3"

[profile.release]
lto = "thin"
strip = true
