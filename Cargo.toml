[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/a6wright/taskstaka"

[workspace.dependencies]
taskstaka-core = { path = "crates/core" }
taskstaka-client = { path = "crates/client" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_norway = "0.9"
jiff = { version = "0.2", features = ["serde"] }
thiserror = "2"
anyhow = "1"
tempfile = "3"
fd-lock = "4"
rand = "0.9"
clap = { version = "4", features = ["derive", "env"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync"] }
axum = "0.8"
ureq = { version = "3", default-features = false, features = ["json"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ratatui = "0.30"
rmcp = { version = "3.5", features = ["server", "macros", "transport-io"] }

insta = { version = "1", features = ["yaml"] }
assert_cmd = "2"
predicates = "3"

[profile.release]
lto = "thin"
strip = true
