<svg class="d-res" viewBox="0 0 720 250" role="img" aria-labelledby="d-res-title" xmlns="http://www.w3.org/2000/svg">
<title id="d-res-title">When the last subtask closes, the story comes back to the top of Next, flagged ready.</title>
<style>
.d-res { font-family: inherit; font-size: 15px; }
.d-res .head { fill: var(--muted, #8a8d94); font-size: 11px; letter-spacing: .08em; }
.d-res .row { fill: var(--bg-2, #141518); stroke: var(--line, #24262b); stroke-width: 1.2; }
.d-res .label { fill: var(--fg, #e8e9eb); font-weight: 500; }
.d-res .dim { fill: var(--muted, #8a8d94); }
.d-res .chip { fill: var(--muted, #8a8d94); font-size: 12.5px; }
.d-res .ready { fill: var(--accent, #e87818); font-size: 12.5px; font-weight: 600; }
.d-res .box { fill: none; stroke: var(--muted, #8a8d94); stroke-width: 1.3; }
.d-res .tick { fill: none; stroke: var(--ok, #4cc38a); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.d-res .r1, .d-res .r2, .d-res .story, .d-res .t2, .d-res .blocked, .d-res .lit, .d-res .ring { animation-duration: 9s; animation-iteration-count: infinite; animation-timing-function: cubic-bezier(.2, .7, .2, 1); }
.d-res .r1 { animation-name: rs-r1; } .d-res .r2 { animation-name: rs-r2; } .d-res .story { animation-name: rs-story; }
.d-res .t2 { animation-name: rs-t2; } .d-res .blocked { animation-name: rs-blocked; } .d-res .lit { animation-name: rs-lit; } .d-res .ring { animation-name: rs-ring; }
/* base state is the final frame; the keyframes start from the earlier one */
@keyframes rs-r1 { 0%, 46% { transform: translate(0, -60px); } 56%, 100% { transform: translate(0, 0); } }
@keyframes rs-r2 { 0%, 30% { transform: translate(0, -60px); opacity: 1; } 36% { transform: translate(0, -60px); opacity: 1; } 44%, 100% { transform: translate(-48px, -60px); opacity: 0; } }
@keyframes rs-t2 { 0%, 29% { opacity: 0; } 30.5%, 100% { opacity: 1; } }
@keyframes rs-story { 0%, 46% { transform: translate(0, 120px); } 56%, 100% { transform: translate(0, 0); } }
@keyframes rs-blocked { 0%, 44% { opacity: 1; } 48%, 100% { opacity: 0; } }
@keyframes rs-lit { 0%, 50% { opacity: 0; } 58%, 100% { opacity: 1; } }
@keyframes rs-ring { 0%, 52% { opacity: 0; transform: scale(1); } 58% { opacity: .9; } 80%, 100% { opacity: 0; transform: scale(1.03); } }
@media (prefers-reduced-motion: reduce) { .d-res * { animation: none !important; } .d-res .blocked, .d-res .ring { opacity: 0; } .d-res .r2 { opacity: 0; } }
</style>
<text class="head" x="120" y="30">NEXT</text>
<!-- the story: ends at the top, ready -->
<g class="story" style="transform-box: fill-box; transform-origin: center;">
  <rect class="ring" x="120" y="40" width="480" height="46" rx="10" fill="none" stroke="var(--accent, #e87818)" stroke-width="2" style="transform-box: fill-box; transform-origin: center;"/>
  <rect class="row" x="120" y="40" width="480" height="46" rx="10"/>
  <rect class="box" x="140" y="54" width="18" height="18" rx="4"/>
  <text class="label" x="172" y="69">Ship the new site</text>
  <text class="chip blocked" x="582" y="69" text-anchor="end">▽ blocked by 1</text>
  <text class="ready lit" x="582" y="69" text-anchor="end">↑ ready</text>
</g>
<!-- another ready row, pushed down by the story -->
<g class="r1">
  <rect class="row" x="120" y="100" width="480" height="46" rx="10"/>
  <rect class="box" x="140" y="114" width="18" height="18" rx="4"/>
  <text class="label" x="172" y="129">Reply to the accountant</text>
</g>
<!-- the last open subtask: ticked, then gone -->
<g class="r2">
  <rect class="row" x="120" y="160" width="480" height="46" rx="10"/>
  <rect class="box" x="140" y="174" width="18" height="18" rx="4"/>
  <path class="tick t2" d="M144 183 l5 5 l9 -10"/>
  <text class="label" x="172" y="189">Write the launch note</text>
  <text class="chip" x="582" y="189" text-anchor="end">‹ Ship the new site</text>
</g>
</svg>
