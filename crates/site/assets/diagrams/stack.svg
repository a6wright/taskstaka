<svg class="d-stack" viewBox="0 0 720 310" role="img" aria-labelledby="d-stack-title" xmlns="http://www.w3.org/2000/svg">
<title id="d-stack-title">A story as a stack: ticking the plate in hand slides the next prerequisite into your hand, until the story itself is ready.</title>
<style>
.d-stack { font-family: inherit; font-size: 15px; }
.d-stack .plate { fill: var(--bg-2, #141518); stroke: var(--line, #24262b); stroke-width: 1.2; }
.d-stack .hand .plate { fill: var(--bg-3, #1b1d21); stroke: color-mix(in srgb, var(--accent, #e87818) 55%, var(--line, #24262b)); stroke-width: 1.6; }
.d-stack .base .plate { fill: var(--bg-2, #141518); }
.d-stack .label { fill: var(--fg, #e8e9eb); font-weight: 500; }
.d-stack .so { fill: var(--muted, #8a8d94); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; }
.d-stack .badge { fill: var(--warn, #e5b45b); font-size: 12.5px; font-weight: 500; }
.d-stack .ready { fill: var(--accent, #e87818); font-size: 12.5px; font-weight: 600; }
.d-stack .box { fill: none; stroke: var(--muted, #8a8d94); stroke-width: 1.3; }
.d-stack .tick { fill: none; stroke: var(--ok, #4cc38a); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.d-stack .ease { animation-timing-function: cubic-bezier(.2, .7, .2, 1); }
.d-stack .p1, .d-stack .p2, .d-stack .p3, .d-stack .base, .d-stack .t1, .d-stack .t2, .d-stack .t3, .d-stack .b2, .d-stack .b3, .d-stack .glow { animation-duration: 11s; animation-iteration-count: infinite; animation-timing-function: cubic-bezier(.2, .7, .2, 1); }
.d-stack .p1 { animation-name: st-p1; } .d-stack .p2 { animation-name: st-p2; } .d-stack .p3 { animation-name: st-p3; }
.d-stack .t1 { animation-name: st-t1; } .d-stack .t2 { animation-name: st-t2; } .d-stack .t3 { animation-name: st-t3; }
.d-stack .b2 { animation-name: st-b2; } .d-stack .b3 { animation-name: st-b3; } .d-stack .glow { animation-name: st-glow; }
/* plate 1: in hand from the start; ticked at 12%, gone by 18% */
@keyframes st-p1 { 0%, 12% { transform: translate(0, 0); opacity: 1; } 18%, 100% { transform: translate(-48px, 0); opacity: 0; } }
@keyframes st-t1 { 0%, 11% { opacity: 0; } 12.5%, 100% { opacity: 1; } }
/* plate 2: moves up into hand at 18–24%, ticked at 42%, gone by 48% */
@keyframes st-p2 { 0%, 18% { transform: translate(0, 0); opacity: 1; } 24%, 42% { transform: translate(0, -62px); opacity: 1; } 48%, 100% { transform: translate(-48px, -62px); opacity: 0; } }
@keyframes st-b2 { 0%, 25% { opacity: 0; } 27%, 100% { opacity: 1; } }
@keyframes st-t2 { 0%, 41% { opacity: 0; } 42.5%, 100% { opacity: 1; } }
/* plate 3: up twice, ticked at 72%, gone by 78% */
@keyframes st-p3 { 0%, 18% { transform: translate(0, 0); } 24%, 48% { transform: translate(0, -62px); } 54%, 72% { transform: translate(0, -124px); opacity: 1; } 78%, 100% { transform: translate(-48px, -124px); opacity: 0; } }
@keyframes st-b3 { 0%, 55% { opacity: 0; } 57%, 100% { opacity: 1; } }
@keyframes st-t3 { 0%, 71% { opacity: 0; } 72.5%, 100% { opacity: 1; } }
/* the story: lights up once nothing is left under it, holds, then the loop restarts */
@keyframes st-glow { 0%, 80% { opacity: 0; } 83%, 96% { opacity: 1; } 100% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) {
  .d-stack * { animation: none !important; }
  .d-stack .t1, .d-stack .t2, .d-stack .t3, .d-stack .b2, .d-stack .b3, .d-stack .glow { opacity: 0; }
}
</style>
<!-- plate 1, in hand -->
<g class="p1 hand">
  <rect class="plate" x="120" y="36" width="480" height="48" rx="10"/>
  <rect class="box" x="140" y="51" width="18" height="18" rx="4"/>
  <path class="tick t1" d="M144 60 l5 5 l9 -10"/>
  <text class="label" x="172" y="66">Renew the cert</text>
  <text class="badge" x="582" y="66" text-anchor="end">▶ in hand</text>
</g>
<!-- plate 2 -->
<g class="p2">
  <rect class="plate" x="120" y="98" width="480" height="48" rx="10"/>
  <rect class="box" x="140" y="113" width="18" height="18" rx="4"/>
  <path class="tick t2" d="M144 122 l5 5 l9 -10"/>
  <text class="label" x="172" y="128">Ask Priya for the DNS record</text>
  <text class="badge b2" x="582" y="128" text-anchor="end">▶ in hand</text>
</g>
<!-- plate 3 -->
<g class="p3">
  <rect class="plate" x="120" y="160" width="480" height="48" rx="10"/>
  <rect class="box" x="140" y="175" width="18" height="18" rx="4"/>
  <path class="tick t3" d="M144 184 l5 5 l9 -10"/>
  <text class="label" x="172" y="190">Restart nginx</text>
  <text class="badge b3" x="582" y="190" text-anchor="end">▶ in hand</text>
</g>
<!-- the story at the base -->
<g class="base">
  <rect class="plate" x="120" y="236" width="480" height="52" rx="10"/>
  <text class="so" x="140" y="266">so that</text>
  <text class="label" x="202" y="268">Ship the new site</text>
  <g class="glow">
    <rect x="120" y="236" width="480" height="52" rx="10" fill="none" stroke="var(--accent, #e87818)" stroke-width="2"/>
    <text class="ready" x="582" y="268" text-anchor="end">↑ ready</text>
  </g>
</g>
</svg>
