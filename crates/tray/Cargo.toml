[package]
name = "taskstaka-tray"
description = "Menu bar item and global hotkey for taskstaka. OS-facing, HTTP-only: talks to the daemon, never imports it."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "taskstaka-tray"
path = "src/main.rs"

[dependencies]
taskstaka-core.workspace = true
taskstaka-client.workspace = true
anyhow.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
tao.workspace = true
tray-icon.workspace = true
global-hotkey.workspace = true
wry.workspace = true
open.workspace = true
png = "0.18"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFRunLoop"] }
